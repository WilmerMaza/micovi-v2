<div class="settings-shell">
  <mat-drawer-container class="settings-shell__container">
    <mat-drawer mode="side" opened class="settings-shell__nav">
      <p class="settings-shell__nav-label">Secciones</p>
      <mat-nav-list class="settings-shell__list">
        <button
          type="button"
          mat-list-item
          class="settings-shell__item settings-shell__item--active"
        >
          <span class="settings-shell__item-title">Complementos</span>
          <span class="settings-shell__item-hint">Extensiones y utilidades</span>
        </button>
      </mat-nav-list>
    </mat-drawer>

    <mat-drawer-content class="settings-shell__content">
      <div class="settings-shell__empty">
        <h2 class="settings-shell__empty-title">Complementos</h2>
        <p class="settings-shell__empty-body">
          Aún no hay complementos disponibles. Cuando se activen para tu
          institución, los verás aquí. Tema y tipografía siguen pendientes.
        </p>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>

  <footer class="settings-shell__legal">
    <span>© Micovi 2026</span>
  </footer>
</div>
