<div
  class="logout-modal-backdrop"
  (click)="onCancel()"
  role="presentation"
>
  <div
    class="logout-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="logout-modal-title"
    aria-describedby="logout-modal-desc"
    (click)="$event.stopPropagation()"
  >
    <div class="logout-modal__icon" aria-hidden="true">
      <mat-icon>logout</mat-icon>
    </div>

    <h2 id="logout-modal-title" class="logout-modal__title">Cerrar sesión</h2>

    <p id="logout-modal-desc" class="logout-modal__message">
      ¿Seguro que quieres cerrar la sesión?
    </p>

    <div class="logout-modal__actions">
      <button
        mat-stroked-button
        type="button"
        class="logout-modal__cancel"
        (click)="onCancel()"
        [disabled]="isLoading()"
      >
        Cancelar
      </button>

      <button
        mat-flat-button
        type="button"
        class="logout-modal__confirm"
        (click)="onConfirm()"
        [disabled]="isLoading()"
        [attr.aria-busy]="isLoading()"
      >
        @if (isLoading()) {
          Cerrando sesión…
        } @else {
          Cerrar sesión
        }
      </button>
    </div>
  </div>
</div>
