<!--
  Shell de configuración: cabecera fija + outlet hijo.
  Guard en rutas hijas; placeholder con delay 300 ms mientras auth/chunk cargan.
-->
<section class="settings-page" aria-labelledby="config-layout-title">
  <header class="settings-page__header">
    <h1 id="config-layout-title" class="settings-page__title">Configuración</h1>
    <p class="settings-page__subtitle">
      Preferencias de la cuenta y de la institución.
    </p>
  </header>

  <div class="settings-page__outlet-wrap">
    <router-outlet #configOutlet="outlet"></router-outlet>
    @if (
      showOutletPlaceholder() &&
      (!configOutlet.isActivated || outletPendingRaw())
    ) {
    <div
      class="settings-outlet-placeholder"
      role="status"
      aria-live="polite"
      aria-label="Cargando configuración"
    >
      <div class="settings-outlet-placeholder__panel" aria-hidden="true">
        <div class="settings-outlet-placeholder__nav"></div>
        <div class="settings-outlet-placeholder__content">
          <div class="settings-outlet-placeholder__line"></div>
          <div class="settings-outlet-placeholder__line settings-outlet-placeholder__line--short"></div>
          <div class="settings-outlet-placeholder__block"></div>
        </div>
      </div>
    </div>
    }
  </div>
</section>
