<div class="profile-menu">
  <!-- Chip de identidad: presencia clara en topbar (no icon-button diminuto) -->
  <button
    type="button"
    class="profile-trigger"
    [matMenuTriggerFor]="mainMenu"
    aria-label="Abrir menú de perfil"
    aria-haspopup="menu"
  >
    <span class="profile-trigger__avatar" aria-hidden="true">{{ initials() }}</span>
    <span class="profile-trigger__text">
      <span class="profile-trigger__name">{{ displayName() }}</span>
      <span class="profile-trigger__role">{{ roleLabel() }}</span>
    </span>
    <mat-icon class="profile-trigger__caret" aria-hidden="true">expand_more</mat-icon>
  </button>

  <mat-menu
    #mainMenu="matMenu"
    [overlapTrigger]="false"
    panelClass="micovi-menu-panel"
    xPosition="before"
    yPosition="below"
  >
    <div class="micovi-menu-header" role="presentation" (click)="$event.stopPropagation()">
      <span class="micovi-menu-header__avatar" aria-hidden="true">{{ initials() }}</span>
      <div class="micovi-menu-header__text">
        <div class="micovi-menu-header__name">{{ displayName() }}</div>
        @if (emailLabel()) {
          <div class="micovi-menu-header__email">{{ emailLabel() }}</div>
        }
        <div class="micovi-menu-header__meta">{{ roleLabel() }}</div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <div class="micovi-menu-actions" role="group" aria-label="Acciones de cuenta">
      <button mat-menu-item class="micovi-menu-item" (click)="configuracion()">
        <mat-icon aria-hidden="true">settings</mat-icon>
        <span class="micovi-menu-item__label">
          <span class="micovi-menu-item__title">Configuración</span>
          <span class="micovi-menu-item__hint">Preferencias de la cuenta</span>
        </span>
      </button>

      <button
        mat-menu-item
        class="micovi-menu-item micovi-menu-item--danger"
        (click)="showLogoutConfirmation()"
      >
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span class="micovi-menu-item__label">
          <span class="micovi-menu-item__title">Cerrar sesión</span>
          <span class="micovi-menu-item__hint">Salir de Micovi</span>
        </span>
      </button>
    </div>
  </mat-menu>
</div>

@if (showLogoutModal()) {
  <app-logout-modal
    [isLoading]="isLoggingOut()"
    (confirmLogout)="confirmLogout()"
    (cancelLogout)="cancelLogout()"
  ></app-logout-modal>
}
