<!--
  Topbar del shell: toggle + contexto de página + profile.
-->
<mat-toolbar class="topbar" [class.sidebar-collapsed]="collapsed()">
  <div class="topbar-left">
    <button
      mat-icon-button
      type="button"
      aria-label="Abrir o cerrar menú lateral"
      (click)="toggleMenu()"
      class="menu-toggle"
    >
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>

    <div class="page-context" aria-live="polite">
      <h1 class="page-title">{{ pageTitle() }}</h1>
      <span class="cycle-chip" title="Contexto de ciclo (placeholder)">
        Sin ciclo activo
      </span>
    </div>
  </div>

  <span class="spacer"></span>
  <app-profile-menu></app-profile-menu>
</mat-toolbar>
