<form [formGroup]="form" class="contacto-form-container">
  <div class="contacto-grid">
    <div class="contacto-fields">

      <div class="phone-container" style="display: flex; gap: 8px;">
        <mat-form-field appearance="outline" style="width: 120px;">
          <mat-label>Prefijo</mat-label>
          <mat-select formControlName="prefijo">
            <mat-option value="+593">+593 (EC)</mat-option>
            <mat-option value="+57">+57 (CO)</mat-option>
            <mat-option value="+51">+51 (PE)</mat-option>
            <mat-option value="+58">+58 (VE)</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" style="flex: 1;">
          <mat-label>Teléfono</mat-label>
          <mat-icon matPrefix>phone</mat-icon>
          <input matInput placeholder="99 123 4567" formControlName="telefono" />
          <mat-error *ngIf="form.get('telefono')?.hasError('required')">
            Este campo es obligatorio
          </mat-error>
          <mat-error *ngIf="form.get('telefono')?.hasError('minlength')">
            El teléfono debe tener al menos 7 dígitos
          </mat-error>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Sede</mat-label>
        <mat-icon matPrefix>location_on</mat-icon>
        <input matInput placeholder="Ciudad o dirección principal" formControlName="sede" />
        <mat-error *ngIf="form.get('sede')?.hasError('required')">
          Este campo es obligatorio
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Página web</mat-label>
        <mat-icon matPrefix>language</mat-icon>
        <input matInput placeholder="www.institucion.com" formControlName="paginaWeb" />
        <mat-error *ngIf="form.get('paginaWeb')?.hasError('minlength')">
          La URL debe tener al menos 5 caracteres
        </mat-error>
      </mat-form-field>

    </div>
  </div>
</form>
